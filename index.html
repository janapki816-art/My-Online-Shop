<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Shop | Fashion & Beauty</title>
<meta name="description" content="Shop fashion, beauty, accessories and home essentials at affordable prices.">
<style>
:root{--green:#176b50;--pale:#edf7ef;--ink:#24352c;--muted:#69766e;--pink:#fff0ed}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
.top{background:var(--green);color:white;text-align:center;padding:9px;font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 5%;border-bottom:1px solid #eee}
.logo{font-size:23px;font-weight:800;color:var(--green);text-decoration:none}
.search{display:flex;flex:1;max-width:430px;min-width:180px;background:#f4f6f4;border-radius:30px;padding:4px 12px}
.search input{border:0;outline:0;background:transparent;width:100%;padding:9px}
button,.btn{border:0;border-radius:24px;padding:12px 17px;background:var(--green);color:white;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
nav{text-align:center;padding:14px;border-bottom:1px solid #eee}nav a{margin:0 13px;color:#34453b;text-decoration:none;font-size:14px}nav a:hover{color:var(--green)}
.hero{margin:22px auto;width:92%;max-width:1250px;background:linear-gradient(120deg,#edf7ef,#fff0ed);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;align-items:center}
.hero-copy{padding:38px 8%}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:bold;color:var(--green)}
.hero h1{font-size:clamp(32px,4.5vw,54px);line-height:1.12;margin:16px 0}.hero p{line-height:1.8;color:var(--muted)}
.hero img{width:100%;height:460px;object-fit:cover;object-position:center 28%;display:block}
section{padding:28px 5%}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.heading h2{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:7px}
.categories,.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.category{background:var(--pale);padding:22px 10px;text-align:center;border-radius:15px;cursor:pointer;border:1px solid transparent}.category:hover{border-color:var(--green)}.category span{display:block;font-size:30px;margin-bottom:9px}
.product{border:1px solid #edf0ed;border-radius:15px;overflow:hidden;background:white;transition:.2s}.product:hover{transform:translateY(-3px);box-shadow:0 8px 22px #193b2610}
.product img{width:100%;height:205px;object-fit:cover;display:block;background:#f6f6f6}.info{padding:13px}.tag{display:inline-block;background:#fff0ed;color:#a74d43;padding:5px 8px;border-radius:18px;font-size:11px}
.info h3{font-size:15px;min-height:34px;margin:10px 0}.price{font-size:19px;font-weight:bold;color:var(--green)}.old{font-size:12px;color:#929b94;text-decoration:line-through;margin-left:5px}.info button{width:100%;margin-top:12px}
.promo{margin:15px 5%;padding:30px;background:#fff0ed;border-radius:18px;text-align:center}.promo p{color:var(--muted);line-height:1.7}
.about{text-align:center;background:#f7faf7;padding:35px 7%;line-height:1.8}.about p{max-width:720px;margin:auto;color:var(--muted)}
footer{background:#183e30;color:white;text-align:center;padding:30px 10px;line-height:2}footer a{color:#c8f1d7}
.whatsapp{position:fixed;right:17px;bottom:17px;z-index:4;background:#20b95a;color:white;border-radius:30px;padding:13px 17px;text-decoration:none;font-weight:bold;box-shadow:0 4px 15px #0002}
#cartPanel{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}.cartbox{background:white;border-radius:17px;padding:22px;width:100%;max-width:450px;max-height:90vh;overflow:auto}
.cartrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.cartrow button{padding:5px 9px;background:#ffe8e8;color:#333}
.cartbox input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:6px 0}.cart-actions{display:flex;gap:10px;margin-top:12px}.cart-actions button{flex:1}
.empty{grid-column:1/-1;padding:25px;text-align:center;color:var(--muted)}
@media(max-width:700px){header{padding:13px 4%}.hero{grid-template-columns:1fr}.hero-copy{padding:28px 7%}.hero img{height:360px}.categories,.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product img{height:175px}section{padding:24px 4%}nav a{display:inline-block;margin:6px 8px}.heading h2{font-size:21px}}
</style>
</head>
